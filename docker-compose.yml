# Local data platform for the Job Postings ELT project.
# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to also wipe all data)

name: job-postings

services:
  postgres:
    image: postgres:17
    container_name: jp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # SQL files here run once, on the very first start (empty volume).
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:?copy .env.example to .env} -d $${POSTGRES_DB:?copy .env.example to .env}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # S3-compatible object storage (our local stand-in for AWS S3).
  # SeaweedFS replaces MinIO, whose community edition is no longer maintained.
  object-storage:
    image: chrislusf/seaweedfs:4.51
    container_name: jp-object-storage
    command: ["mini", "-dir=/data", "-bucket=${S3_BUCKET_RAW:?copy .env.example to .env}"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?copy .env.example to .env}
    ports:
      - "${S3_PORT:-8333}:8333"   # S3 API
      - "8888:8888"               # Filer UI: browse stored files in the browser
    volumes:
      - s3_data:/data
    restart: unless-stopped

volumes:
  pg_data:
  s3_data:
