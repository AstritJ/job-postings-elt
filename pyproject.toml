[project]
name = "job-pipeline"
version = "0.1.0"
description = "End-to-end ELT pipeline for job posting data: Scrapy -> S3 -> PostgreSQL -> dbt -> dashboards."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43",
    "httpx>=0.28",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
    "pre-commit>=4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: needs the Docker stack running (docker compose up -d)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
